openapi: 3.1.0
info:
  title: LazyOrch API
  description: |
    HTTP API for the LazyOrch user-level daemon (loopback only by default).

    **Private-beta freeze (PR-23):** this document matches the routes implemented
    in `@lazyorch/daemon` (`createDaemonHttpServer`). Breaking path/method changes
    require a major API bump (`api_major` in health/status). Additive fields on
    response objects are allowed within a major.

    Auth summary:
    - Bind: `127.0.0.1` (default). Off-loopback, browser `Origin`, or
      `--require-auth` → Bearer required.
    - Context **writes** always require Bearer (even on loopback).
    - Health endpoints remain public.
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:7420
    description: Default local daemon (port may scan 7420–7430)
tags:
  - name: health
  - name: status
  - name: projects
  - name: runs
  - name: context
  - name: adapters
  - name: models
  - name: events
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness / health probe (no auth)
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Daemon is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health:
    get:
      tags: [health]
      summary: Liveness / health probe (v1 alias)
      operationId: getHealthV1
      security: []
      responses:
        "200":
          description: Daemon is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/status:
    get:
      tags: [status]
      summary: Global overview (projects + run counts)
      operationId: getStatus
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/projects:
    get:
      tags: [projects]
      summary: List registered project roots
      operationId: listProjects
      responses:
        "200":
          description: Registered projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegisteredProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/projects/init:
    post:
      tags: [projects]
      summary: Register a project root with the daemon
      operationId: initProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_root]
              properties:
                repo_root:
                  type: string
                  description: Absolute or resolvable project root path
                id:
                  type: string
                  description: Optional project id (generated if omitted)
                name:
                  type: string
      responses:
        "200":
          description: Project registered
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/RegisteredProject"
        "400":
          description: Missing repo_root or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Registry conflict (id/root cross-match)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Request body too large (max 64 KiB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/runs:
    get:
      tags: [runs]
      summary: List runs known to the daemon
      description: |
        Returns in-memory run stubs registered with the daemon process.
        Empty until orchestrator wiring persists runs into this map.
      operationId: listRuns
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Optional project id filter
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/StubRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/adapters:
    get:
      tags: [adapters]
      summary: Adapter registry list + health (stub)
      description: |
        Built-in adapter stubs for private beta. Live discovery/health remains
        on the CLI (`lazyorch doctor` / adapter commands).
      operationId: listAdapters
      responses:
        "200":
          description: Built-in adapter stubs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdaptersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/models/route:
    get:
      tags: [models]
      summary: Dry-run model router (stub)
      description: |
        HTTP stub for GUI/clients. Prefer `lazyorch models route` for the full
        pure router dry-run against config.
      operationId: routeModel
      parameters:
        - name: role
          in: query
          schema:
            type: string
            default: worker
        - name: task
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Routing decision stub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRouteStub"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/runs/{id}/context:
    get:
      tags: [context]
      summary: List shared context KV for a run
      operationId: listRunContext
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ProjectQuery"
      responses:
        "200":
          description: Context keys + kv map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Ambiguous run id across projects (pass ?project=)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/runs/{id}/context/{key}:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/ContextKey"
      - $ref: "#/components/parameters/ProjectQuery"
    get:
      tags: [context]
      summary: Get one context key
      operationId: getRunContextKey
      responses:
        "200":
          description: Key value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextGetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Run or key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Ambiguous run id across projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      tags: [context]
      summary: Set context key (body `{ "value": ... }`)
      description: |
        Write ACL: Bearer required (even on loopback). system/human/lead always write;
        worker only when `context.worker_write: true`; reviewer/qa/plan roles read-only.
        Missing `X-LazyOrch-Actor-Role` with Bearer defaults to human. Role claims remain
        client-asserted until session identity is wired (TODO). Document caps: 512 keys,
        128 KiB total kv JSON, 16 KiB per value.
        **Not for secrets** — use OS/credential stores; context is operator/agent shared facts.
      operationId: putRunContextKey
      security:
        - bearerAuth: []
      parameters:
        - name: X-LazyOrch-Actor-Role
          in: header
          schema:
            type: string
            enum: [system, human, lead, worker, reviewer, qa, plan_writer, plan_reviewer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {}
      responses:
        "200":
          description: Key set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextGetResponse"
        "401":
          description: Bearer required for writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Role cannot write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Ambiguous run id across projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Value or document quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      tags: [context]
      summary: Delete context key
      operationId: deleteRunContextKey
      security:
        - bearerAuth: []
      parameters:
        - name: X-LazyOrch-Actor-Role
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDeleteResponse"
        "401":
          description: Bearer required for writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Role cannot write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Run or key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Ambiguous run id across projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/events:
    get:
      tags: [events]
      summary: Server-Sent Events stream (ephemeral live fan-out)
      description: |
        Live event stream only. `Last-Event-ID` / `?after=` JSONL replay
        is deferred; durable history remains under `<repo>/.lazyorch/events/*.jsonl`.
        CORS reflects an allowlist of local GUI origins (not `*`); Bearer is required
        when the request carries an `Origin` header.
      operationId: streamEvents
      parameters:
        - name: project
          in: query
          description: Optional project_id filter
          schema:
            type: string
        - name: after
          in: query
          description: Reserved for future event-id cursor replay (not implemented)
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Run id
    ContextKey:
      name: key
      in: path
      required: true
      description: Context key (may include `/` for namespaced keys, e.g. model_pin/worker)
      schema:
        type: string
    ProjectQuery:
      name: project
      in: query
      description: Optional project id to disambiguate multi-project daemons
      schema:
        type: string
  responses:
    Unauthorized:
      description: Bearer token required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    HealthResponse:
      type: object
      required: [ok, status, api_major, host, port, started_at, pid]
      properties:
        ok:
          type: boolean
        status:
          type: string
          example: healthy
        api_major:
          type: integer
          example: 1
        host:
          type: string
        port:
          type: integer
        started_at:
          type: string
          format: date-time
        pid:
          type: integer
    StatusResponse:
      type: object
      required: [ok, api_major, started_at, project_count, run_count, projects]
      properties:
        ok:
          type: boolean
        api_major:
          type: integer
        started_at:
          type: string
          format: date-time
        project_count:
          type: integer
        run_count:
          type: integer
        projects:
          type: array
          items:
            $ref: "#/components/schemas/RegisteredProject"
    RegisteredProject:
      type: object
      required: [id, repo_root]
      properties:
        id:
          type: string
        repo_root:
          type: string
        name:
          type: string
        registered_at:
          type: string
          format: date-time
    StubRun:
      type: object
      required: [id, project_id, phase, created_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        phase:
          type: string
        idea:
          type: string
        created_at:
          type: string
          format: date-time
    AdaptersResponse:
      type: object
      required: [adapters, stub]
      properties:
        stub:
          type: boolean
          description: True while HTTP returns built-in stubs
        adapters:
          type: array
          items:
            type: object
            required: [id, source, health, capabilities]
            properties:
              id:
                type: string
                enum: [claude, codex, agy, grok, shell]
              source:
                type: string
                example: builtin
              health:
                type: string
              capabilities:
                type: object
                properties:
                  models:
                    type: boolean
                  cancel:
                    type: boolean
    ModelRouteStub:
      type: object
      required: [stub, role, task_id, tier, adapter_id, model, reason]
      properties:
        stub:
          type: boolean
        role:
          type: string
        task_id:
          type: string
          nullable: true
        tier:
          type: string
        adapter_id:
          type: string
        model:
          type: string
        reason:
          type: string
    ContextListResponse:
      type: object
      description: |
        Shape from `listContextResponse` — always includes document `updated_at`.
      required: [run_id, updated_at, keys, kv]
      properties:
        run_id:
          type: string
        updated_at:
          type: string
          format: date-time
        keys:
          type: array
          items:
            type: string
        kv:
          type: object
          additionalProperties: true
    ContextGetResponse:
      type: object
      description: |
        Shape from `getContextResponse` / PUT success. Missing keys return HTTP 404
        (`ContextKvError`), not a body with `found: false`.
      required: [run_id, key, value, updated_at]
      properties:
        run_id:
          type: string
        key:
          type: string
        value: {}
        updated_at:
          type: string
          format: date-time
    ContextDeleteResponse:
      type: object
      description: DELETE success body when the key existed
      required: [ok, run_id, key, deleted]
      properties:
        ok:
          type: boolean
          example: true
        run_id:
          type: string
        key:
          type: string
        deleted:
          type: boolean
          example: true
    ErrorBody:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
        run_id:
          type: string
        project_id:
          type: string
          nullable: true
        project_ids:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token from `~/.lazyorch/daemon.token` (mode 0600 / Windows user ACL).
        Required off-loopback, when Origin is present, or with --require-auth.
        Health endpoints remain public. Context writes always require Bearer.
