openapi: 3.1.0
info:
  title: LazyOrch API
  description: |
    HTTP API for the LazyOrch user-level daemon (loopback).
    PR-06 stubs: health, projects, runs list, adapters, models/route, SSE events.
    PR-14: shared run context KV under /v1/runs/:id/context.
    Full schemas land with later PRs.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:7420
    description: Default local daemon
paths:
  /health:
    get:
      summary: Liveness / health probe (no auth)
      operationId: getHealth
      responses:
        "200":
          description: Daemon is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health:
    get:
      summary: Liveness / health probe (v1 alias)
      operationId: getHealthV1
      responses:
        "200":
          description: Daemon is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/status:
    get:
      summary: Global overview (projects + run counts)
      operationId: getStatus
      responses:
        "200":
          description: Status payload
  /v1/projects:
    get:
      summary: List registered project roots
      operationId: listProjects
      responses:
        "200":
          description: Registered projects
  /v1/projects/init:
    post:
      summary: Register a project root with the daemon
      operationId: initProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_root]
              properties:
                repo_root:
                  type: string
                id:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: Project registered
        "409":
          description: Registry conflict (id/root cross-match)
        "413":
          description: Request body too large (max 64 KiB)
  /v1/runs:
    get:
      summary: List runs (stub; empty until orchestrator wired)
      operationId: listRuns
      parameters:
        - name: project
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Run list
  /v1/adapters:
    get:
      summary: Adapter registry list + health (stub)
      operationId: listAdapters
      responses:
        "200":
          description: Built-in adapter stubs
  /v1/models/route:
    get:
      summary: Dry-run model router (stub)
      operationId: routeModel
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: task
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Routing decision stub
  /v1/runs/{id}/context:
    get:
      summary: List shared context KV for a run
      operationId: listRunContext
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: Optional project id to disambiguate multi-project daemons
          schema:
            type: string
      responses:
        "200":
          description: Context keys + kv map
        "404":
          description: Run not found
  /v1/runs/{id}/context/{key}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        description: Context key (may include `/` for namespaced keys, e.g. model_pin/worker)
        schema:
          type: string
      - name: project
        in: query
        schema:
          type: string
    get:
      summary: Get one context key
      operationId: getRunContextKey
      responses:
        "200":
          description: Key value
        "404":
          description: Run or key not found
    put:
      summary: Set context key (body `{ "value": ... }`)
      description: |
        Write ACL: Bearer required (even on loopback). system/human/lead always write;
        worker only when `context.worker_write: true`; reviewer/qa/plan roles read-only.
        Missing `X-LazyOrch-Actor-Role` with Bearer defaults to human. Role claims remain
        client-asserted until session identity is wired (TODO). Document caps: 512 keys,
        128 KiB total kv JSON, 16 KiB per value.
      operationId: putRunContextKey
      security:
        - bearerAuth: []
      parameters:
        - name: X-LazyOrch-Actor-Role
          in: header
          schema:
            type: string
            enum: [system, human, lead, worker, reviewer, qa, plan_writer, plan_reviewer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {}
      responses:
        "200":
          description: Key set
        "401":
          description: Bearer required for writes
        "403":
          description: Role cannot write
        "404":
          description: Run not found
        "409":
          description: Ambiguous run id across projects
        "413":
          description: Value or document quota exceeded
    delete:
      summary: Delete context key
      operationId: deleteRunContextKey
      security:
        - bearerAuth: []
      parameters:
        - name: X-LazyOrch-Actor-Role
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Bearer required for writes
        "403":
          description: Role cannot write
        "404":
          description: Run or key not found
        "409":
          description: Ambiguous run id across projects
  /v1/events:
    get:
      summary: Server-Sent Events stream (ephemeral live fan-out)
      description: |
        Live event stream only for PR-06. `Last-Event-ID` / `?after=` JSONL replay
        is deferred; durable history remains under `<repo>/.lazyorch/events/*.jsonl`.
        CORS reflects an allowlist of local GUI origins (not `*`); Bearer is required
        when the request carries an `Origin` header.
      operationId: streamEvents
      parameters:
        - name: project
          in: query
          description: Optional project_id filter
          schema:
            type: string
        - name: after
          in: query
          description: Reserved for future event-id cursor replay (not implemented)
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
        api_major:
          type: integer
        host:
          type: string
        port:
          type: integer
        started_at:
          type: string
          format: date-time
        pid:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token from ~/.lazyorch/daemon.token (mode 0600 / Windows user ACL).
        Required off-loopback, when Origin is present, or with --require-auth.
        Health endpoints remain public.
