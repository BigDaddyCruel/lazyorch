[package]
name = "lazyorch-gui"
version = "0.0.0"
description = "LazyOrch Windows GUI — thin Tauri 2 shell (no orchestration)"
authors = ["LazyOrch"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lazyorch_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
